version: '3.8'

services:
  epic-claimer:
    build: .
    container_name: epic-games-claimer
    environment:
      - EPIC_EMAIL=${EPIC_EMAIL}
      - EPIC_PASSWORD=${EPIC_PASSWORD}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - HEADLESS=true
      - SCREENSHOT_ON_ERROR=true
      - LOG_LEVEL=info
      - BROWSER_TIMEOUT=30000
      - MAX_RETRIES=3
      - RETRY_DELAY_MS=2000
    volumes:
      - epic-logs:/app/logs
      - epic-sessions:/app/sessions
      - epic-screenshots:/app/screenshots
    restart: "no"
    networks:
      - epic-network

volumes:
  epic-logs:
    driver: local
  epic-sessions:
    driver: local
  epic-screenshots:
    driver: local

networks:
  epic-network:
    driver: bridge
