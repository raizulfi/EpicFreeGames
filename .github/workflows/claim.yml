name: Epic Games Free Games Claimer

on:
  schedule:
    - cron: '0 10 * * 4'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build

      - name: Restore session
        run: |
          mkdir -p sessions
          echo "${{ secrets.EPIC_SESSION }}" | base64 -d > sessions/session.json

      - name: Login to Epic Games
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          HEADLESS: 'true'
          LOG_LEVEL: 'info'
        run: npm run login
        continue-on-error: true

      - name: Run claimer
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEADLESS: 'true'
          SCREENSHOT_ON_ERROR: 'true'
          LOG_LEVEL: 'info'
        run: npm run claim
        continue-on-error: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claimer-logs
          path: logs/
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claimer-screenshots
          path: screenshots/
          retention-days: 7